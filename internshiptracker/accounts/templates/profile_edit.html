<div id="profile-editor" class="profile-editor mt-2">
    <form method="post" action="{% url 'edit_profile' %}"
          hx-post="{% url 'edit_profile' %}" hx-target="#profile-editor" hx-swap="outerHTML">
        {% csrf_token %}
        <div class="row g-2 align-items-end">
            <div class="col-auto">
                <label class="form-label small mb-1" for="{{ form.first_name.id_for_label }}">First name</label>
                {{ form.first_name }}
                {{ form.first_name.errors }}
            </div>
            <div class="col-auto">
                <label class="form-label small mb-1" for="{{ form.last_name.id_for_label }}">Last name</label>
                {{ form.last_name }}
                {{ form.last_name.errors }}
            </div>
            <div class="col-auto d-flex gap-2">
                <button class="btn btn-sm btn-1" type="submit">Save</button>
                <button class="btn btn-sm btn-light" type="button"
                        hx-get="{% url 'edit_profile' %}" hx-target="#profile-editor" hx-swap="outerHTML">
                    Cancel
                </button>
            </div>
        </div>
    </form>
</div>
