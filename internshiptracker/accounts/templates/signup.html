
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{% static 'style.css' %}" rel="stylesheet">
</head>

<body class="login-page">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">

        <div class="login-card signup-card w-100">

            <form method="POST" action="{% url 'signup' %}">
                {% csrf_token %}

                <h1 class="text-center mb-4">Sign Up</h1>

                <!-- Django Messages -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-info alert-dismissible fade show"
                             role="alert">
                            {{ message }}
                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="alert"
                                    aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <!-- First Name -->
                <div class="form-group-icon mb-3">
                    <input
                        type="text"
                        name="first_name"
                        class="form-control custom-input"
                        placeholder="First Name"
                        autocomplete="given-name"
                        required>
                    <i class="bx bxs-user"></i>
                </div>

                <!-- Last Name -->
                <div class="form-group-icon mb-3">
                    <input
                        type="text"
                        name="last_name"
                        class="form-control custom-input"
                        placeholder="Last Name"
                        autocomplete="family-name"
                        required>
                    <i class="bx bxs-user"></i>
                </div>

                <!-- Username -->
                <div class="form-group-icon mb-3">
                    <input
                        type="text"
                        name="username"
                        class="form-control custom-input"
                        placeholder="Username"
                        autocomplete="username"
                        required>
                    <i class="bx bxs-user"></i>
                </div>

                <!-- Email -->
                <div class="form-group-icon mb-3">
                    <input
                        type="email"
                        name="email"
                        class="form-control custom-input"
                        placeholder="Email Address"
                        autocomplete="email"
                        required>
                    <i class="bx bxs-envelope"></i>
                </div>

                <!-- Password -->
                <div class="form-group-icon mb-4">
                    <input
                        type="password"
                        name="password"
                        class="form-control custom-input"
                        placeholder="Password"
                        autocomplete="new-password"
                        required>
                    <i class="bx bxs-lock-alt"></i>
                </div>

                <!-- Create Account -->
                <button type="submit" class="btn login-btn w-100">
                    Create Account
                </button>

                <!-- Login Link -->
                <p class="text-center mt-4 mb-0 register-text">
                    Already have an account?
                    <a href="{% url 'login' %}" class="custom-link fw-bold">
                        Log in
                    </a>
                </p>

            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
