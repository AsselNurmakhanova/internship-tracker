{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="{% static 'style.css' %}" rel="stylesheet">
</head>

<body class="login-page">
    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
        <div class="login-card w-100">
            <form action="" method="POST">
                {% csrf_token %}
                <h1 class="text-center mb-4">Log in</h1>
                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-info alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
                {% endif %}
                <div class="form-group-icon mb-4">
                    <input type="text" name="username" class="form-control custom-input" placeholder="Username"
                        autocomplete="username" required>
                    <i class="bx bxs-user"></i>
                </div>
                <div class="form-group-icon mb-4">
                    <input type="password" name="password" class="form-control custom-input" placeholder="Password"
                        autocomplete="current-password" required>
                    <i class="bx bxs-lock-alt"></i>
                </div>
                <div class="d-flex justify-content-between align-items-center
                            flex-wrap gap-2 mb-4 remember-forgot">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe" name="remember_me">
                        <label class="form-check-label" for="rememberMe">
                            Remember me
                        </label>
                    </div>

                    <a href="#" class="custom-link">
                        Forgot password?
                    </a>
                </div>
                <button type="submit" class="btn login-btn w-100">
                    Submit
                </button>
                <p class="text-center mt-4 mb-0 register-text">
                    Don't have an account?
                    <a href="{% url 'signup' %}" class="custom-link fw-bold">
                        Register
                    </a>
                </p>

            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
